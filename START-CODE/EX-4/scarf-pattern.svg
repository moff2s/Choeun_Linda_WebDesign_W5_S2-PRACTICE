<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <defs>
    <!-- Plaid scarf with fringe -->
    <g id="plaidScarf">
      <!-- fringe -->
      <g stroke="#e9d9c4" stroke-width="2.5" stroke-linecap="round">
        <path d="M-6 6 v-10 M-6 12 v-10 M-6 18 v-10 M-6 24 v-10 M-6 30 v-10"/>
        <path d="M106 6 v-10 M106 12 v-10 M106 18 v-10 M106 24 v-10 M106 30 v-10" transform="translate(0 0)"/>
      </g>
      <rect x="0" y="0" width="100" height="36" rx="3" fill="#7b2d4a"/>
      <!-- plaid bands -->
      <g fill="#e98a7a" opacity="0.75">
        <rect x="14" y="0" width="8" height="36"/>
        <rect x="50" y="0" width="8" height="36"/>
        <rect x="86" y="0" width="8" height="36"/>
      </g>
      <g fill="#f6e3c8" opacity="0.8">
        <rect x="0" y="8" width="100" height="3"/>
        <rect x="0" y="25" width="100" height="3"/>
      </g>
    </g>

    <!-- Striped scarf with fringe -->
    <g id="stripeScarf">
      <g stroke="#7b2d4a" stroke-width="2.5" stroke-linecap="round">
        <path d="M-6 6 v-10 M-6 12 v-10 M-6 18 v-10 M-6 24 v-10 M-6 30 v-10"/>
        <path d="M106 6 v-10 M106 12 v-10 M106 18 v-10 M106 24 v-10 M106 30 v-10"/>
      </g>
      <rect x="0" y="0" width="100" height="36" rx="3" fill="#f6e3c8"/>
      <g fill="#c8553d">
        <rect x="10" y="0" width="10" height="36"/>
        <rect x="34" y="0" width="10" height="36"/>
        <rect x="58" y="0" width="10" height="36"/>
        <rect x="82" y="0" width="10" height="36"/>
      </g>
      <g fill="#7b2d4a">
        <rect x="24" y="0" width="3" height="36"/>
        <rect x="48" y="0" width="3" height="36"/>
        <rect x="72" y="0" width="3" height="36"/>
      </g>
    </g>

    <!-- Snowflake / sparkle -->
    <path id="spark" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#fff4e8"/>

    <!-- Seamless tile -->
    <pattern id="tile" width="320" height="320" patternUnits="userSpaceOnUse">
      <rect width="320" height="320" fill="#f2b8a2"/>
      <use href="#plaidScarf"  transform="translate(30 40) rotate(-14 50 18) scale(1.15)"/>
      <use href="#stripeScarf" transform="translate(180 60) rotate(12 50 18) scale(1.15)"/>
      <use href="#stripeScarf" transform="translate(40 200) rotate(10 50 18) scale(1.15)"/>
      <use href="#plaidScarf"  transform="translate(190 220) rotate(-10 50 18) scale(1.15)"/>
      <use href="#spark" transform="translate(160 150)"/>
      <use href="#spark" transform="translate(160 15) scale(0.6)"/>
      <use href="#spark" transform="translate(15 150) scale(0.6)"/>
      <use href="#spark" transform="translate(305 150) scale(0.6)"/>
      <use href="#spark" transform="translate(160 305) scale(0.6)"/>
    </pattern>
  </defs>

  <rect width="960" height="960" fill="url(#tile)"/>
</svg>
