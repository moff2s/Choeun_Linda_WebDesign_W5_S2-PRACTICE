<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <defs>
    <!-- Boot 1: block-heel ankle boot -->
    <g id="blockBoot">
      <path d="M30 10 L58 10 L58 48 Q60 56 78 60 Q94 64 94 74 L94 78 L28 78 Z" fill="#8a3b2e"/>
      <path d="M28 78 L44 78 L42 94 L28 94 Z" fill="#3b1f1a"/>
      <path d="M28 78 L94 78" stroke="#3b1f1a" stroke-width="4" stroke-linecap="round"/>
      <path d="M33 16 L55 16" stroke="#c2705f" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Boot 2: pointed stiletto ankle boot -->
    <g id="stilettoBoot">
      <path d="M32 15 L58 15 L58 46 Q64 58 98 78 L96 82 L34 76 Q30 60 32 15 Z" fill="#2a2024"/>
      <path d="M32 76 L41 77 L38 100 L35 100 Z" fill="#2a2024"/>
      <path d="M36 22 L54 22 M36 30 L54 30 M36 38 L54 38" stroke="#5a4a50" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Boot 3: cowboy boot -->
    <g id="cowboyBoot">
      <path d="M30 5 L60 5 L60 55 Q62 65 88 70 Q98 72 98 78 L28 78 Z" fill="#d98c63"/>
      <path d="M28 78 L46 78 L44 92 L28 92 Z" fill="#7a3a28"/>
      <path d="M30 5 L60 5 L58 14 Q45 20 32 14 Z" fill="#7a3a28"/>
      <path d="M36 32 Q45 24 54 32 Q45 40 36 32 Z" fill="none" stroke="#7a3a28" stroke-width="2"/>
      <path d="M38 50 Q45 44 52 50" fill="none" stroke="#7a3a28" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Sparkle -->
    <path id="spark" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#fff4e8"/>

    <!-- Seamless tile -->
    <pattern id="tile" width="320" height="320" patternUnits="userSpaceOnUse">
      <rect width="320" height="320" fill="#f6cfae"/>
      <use href="#blockBoot"    transform="translate(20 20) rotate(-18 50 50) scale(1.2)"/>
      <use href="#cowboyBoot"   transform="translate(185 30) rotate(14 50 50) scale(1.2)"/>
      <use href="#stilettoBoot" transform="translate(30 175) rotate(10 50 50) scale(1.2)"/>
      <use href="#blockBoot"    transform="translate(190 185) rotate(-8 50 50) scale(1.2)"/>
      <use href="#spark" transform="translate(160 150)"/>
      <use href="#spark" transform="translate(160 20) scale(0.6)"/>
      <use href="#spark" transform="translate(20 150) scale(0.6)"/>
      <use href="#spark" transform="translate(300 160) scale(0.6)"/>
      <use href="#spark" transform="translate(160 300) scale(0.6)"/>
    </pattern>
  </defs>

  <rect width="960" height="960" fill="url(#tile)"/>
</svg>
