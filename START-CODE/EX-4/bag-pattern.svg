<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <defs>
    <!-- Tote bag -->
    <g id="tote">
      <path d="M26 24 Q26 -6 50 -6 Q74 -6 74 24" fill="none" stroke="#5a2a3a" stroke-width="5" stroke-linecap="round"/>
      <path d="M12 24 L88 24 L96 92 Q96 98 90 98 L10 98 Q4 98 4 92 Z" fill="#c8553d"/>
      <path d="M12 24 L88 24 L89 34 L11 34 Z" fill="#a6402c"/>
      <circle cx="50" cy="52" r="5" fill="#f6e3c8"/>
    </g>

    <!-- Structured handbag with flap -->
    <g id="handbag">
      <path d="M30 30 Q30 4 52 4 Q74 4 74 30" fill="none" stroke="#2a2024" stroke-width="5" stroke-linecap="round"/>
      <rect x="6" y="28" width="92" height="62" rx="10" fill="#7b2d4a"/>
      <path d="M6 38 Q6 28 16 28 L88 28 Q98 28 98 38 L98 52 Q52 70 6 52 Z" fill="#5f2038"/>
      <rect x="44" y="54" width="16" height="12" rx="3" fill="#f2c079"/>
      <circle cx="52" cy="60" r="2" fill="#7b2d4a"/>
    </g>

    <!-- Crossbody bag with strap -->
    <g id="crossbody">
      <path d="M20 40 Q50 -30 84 40" fill="none" stroke="#e8a58f" stroke-width="4" stroke-linecap="round"/>
      <rect x="8" y="38" width="90" height="52" rx="12" fill="#f6e3c8"/>
      <path d="M8 52 Q8 38 22 38 L84 38 Q98 38 98 52 Q52 70 8 52 Z" fill="#e8c9a3"/>
      <circle cx="53" cy="62" r="5" fill="#c8553d"/>
    </g>

    <!-- Sparkle -->
    <path id="spark" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#fff4e8"/>

    <!-- Seamless tile -->
    <pattern id="tile" width="320" height="320" patternUnits="userSpaceOnUse">
      <rect width="320" height="320" fill="#f4c9b0"/>
      <use href="#tote"      transform="translate(28 40) rotate(-12 50 50) scale(1.1)"/>
      <use href="#handbag"   transform="translate(185 40) rotate(10 50 50) scale(1.1)"/>
      <use href="#crossbody" transform="translate(32 190) rotate(9 50 50) scale(1.1)"/>
      <use href="#tote"      transform="translate(190 195) rotate(-8 50 50) scale(1.1)"/>
      <use href="#spark" transform="translate(160 160)"/>
      <use href="#spark" transform="translate(160 15) scale(0.6)"/>
      <use href="#spark" transform="translate(15 160) scale(0.6)"/>
      <use href="#spark" transform="translate(305 160) scale(0.6)"/>
      <use href="#spark" transform="translate(160 305) scale(0.6)"/>
    </pattern>
  </defs>

  <rect width="960" height="960" fill="url(#tile)"/>
</svg>
